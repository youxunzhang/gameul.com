<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game | GameUL</title>
  <meta name="description" content="Play free browser games on GameUL.">
  <meta property="og:site_name" content="GameUL">
  <meta property="og:title" content="GameUL | Game Detail">
  <meta property="og:description" content="Play free browser games on GameUL.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=80">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #0d102b;
      --card: #13173a;
      --accent: #7b6ef6;
      --muted: #c9cde5;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d102b; color: #f5f7ff; font-family: 'Inter', system-ui, sans-serif; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    header { position: sticky; top: 0; background: rgba(13, 16, 43, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 10; }
    .nav { max-width: 1200px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; }
    .brand-badge { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #7b6ef6, #4de0ff); display: grid; place-items: center; color: #0d102b; font-weight: 800; }
    .nav-links { display: flex; gap: 14px; list-style: none; color: var(--muted); flex-wrap: wrap; }
    .nav-links a { padding: 6px 10px; border-radius: 10px; }
    .nav-links a:hover { background: rgba(255,255,255,0.08); color: #fff; }

    main { max-width: 1200px; margin: 0 auto; padding: 26px 20px 60px; display: grid; gap: 18px; grid-template-columns: 2fr 1.1fr; }
    .hero { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
    .hero img { width: 100%; border-radius: 14px; height: 260px; object-fit: cover; }
    .hero h1 { font-size: 2rem; }
    .tag { display: inline-flex; padding: 6px 10px; background: rgba(255,255,255,0.08); border-radius: 999px; font-size: 0.9rem; color: #d6dbff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: linear-gradient(120deg, #7b6ef6, #4de0ff); color: #0d102b; font-weight: 700; margin-top: 8px; text-decoration: none; }

    .panel { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 18px; }
    .panel h2 { margin-bottom: 10px; }
    .panel p { color: var(--muted); }
    details { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    details summary { cursor: pointer; font-weight: 700; }
    details p { margin-top: 6px; }

    .related-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .related-card { display: grid; grid-template-columns: 80px 1fr; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
    .related-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; }
    .related-card span { color: var(--muted); font-size: 0.9rem; display: block; }

    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="/">
        <span class="brand-badge" aria-hidden="true">GU</span>
        <span>GameUL</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/games/">Games</a></li>
        <li><a href="/games/#Trending">Trending</a></li>
        <li><a href="/about-us.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main id="game-root">
    <section class="hero">
      <img id="game-image" src="" alt="" loading="lazy">
      <div>
        <span class="tag" id="game-category"></span>
        <h1 id="game-title">Game Title</h1>
        <p id="game-description"></p>
        <a class="btn" id="game-play" href="#" target="_blank" rel="noopener">Start Playing</a>
      </div>
    </section>
    <section class="panel">
      <h2>How to Play</h2>
      <div id="controls"></div>
    </section>
    <section class="panel">
      <h2>FAQ</h2>
      <div id="faq"></div>
    </section>
    <section class="panel">
      <h2>Related Games</h2>
      <div id="related"></div>
    </section>
  </main>

  <script src="/games/data.js"></script>
  <script src="/games/detail-page.js"></script>
</body>
</html>
