<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Games | GameUL</title>
  <meta name="description" content="Browse all free games on GameUL. Filter by category, popularity, and newest releases.">
  <meta property="og:site_name" content="GameUL">
  <meta property="og:title" content="All Games | GameUL">
  <meta property="og:description" content="Browse all free games on GameUL. Filter by category, popularity, and newest releases.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:url" content="https://gameul.com/games/">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #0d102b;
      --card: #13173a;
      --accent: #7b6ef6;
      --muted: #c9cde5;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d102b; color: #f5f7ff; font-family: 'Inter', system-ui, sans-serif; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }

    header { position: sticky; top: 0; background: rgba(13, 16, 43, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 10; }
    .nav { max-width: 1200px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; }
    .brand-badge { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #7b6ef6, #4de0ff); display: grid; place-items: center; color: #0d102b; font-weight: 800; }
    .nav-links { display: flex; gap: 14px; list-style: none; color: var(--muted); flex-wrap: wrap; }
    .nav-links a { padding: 6px 10px; border-radius: 10px; }
    .nav-links a:hover { background: rgba(255,255,255,0.08); color: #fff; }

    main { max-width: 1200px; margin: 0 auto; padding: 26px 20px 60px; }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    p.lead { color: var(--muted); margin-bottom: 18px; }

    .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 18px; }
    input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06); color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card { background: var(--card); border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
    .card img { width: 100%; height: 150px; object-fit: cover; display: block; }
    .card-body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .tag { display: inline-flex; padding: 6px 10px; background: rgba(255,255,255,0.08); border-radius: 999px; font-size: 0.9rem; color: #d6dbff; }
    .pagination { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
    .page-btn { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; }
    .page-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="/">
        <span class="brand-badge" aria-hidden="true">GU</span>
        <span>GameUL</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="#Trending">Trending</a></li>
        <li><a href="#New">New</a></li>
        <li><a href="/about-us.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>All Games</h1>
    <p class="lead">Browse all free games on GameUL. Filter by category, popularity, and newest releases.</p>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by name or keyword" aria-label="Search games">
      <select id="category">
        <option value="All">All Categories</option>
        <option value="Action">Action</option>
        <option value="Arcade">Arcade</option>
        <option value="Puzzle">Puzzle</option>
        <option value="Strategy">Strategy</option>
        <option value="Multiplayer">Multiplayer</option>
      </select>
    </div>

    <div class="grid" id="games-grid"></div>
    <div class="pagination">
      <button class="page-btn" id="prev">Previous</button>
      <button class="page-btn" id="next">Next</button>
    </div>
  </main>

  <script src="/games/data.js"></script>
  <script>
    const grid = document.getElementById('games-grid');
    const search = document.getElementById('search');
    const category = document.getElementById('category');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const pageSize = 12;
    let page = 0;

    function template(game) {
      return `
        <article class="card">
          <a href="/games/${game.slug}/">
            <img src="${game.image}" alt="${game.name}" loading="lazy">
          </a>
          <div class="card-body">
            <span class="tag">${game.category}</span>
            <h3><a href="/games/${game.slug}/">${game.name}</a></h3>
            <p>${game.shortDescription}</p>
          </div>
        </article>`;
    }

    function filterGames() {
      const q = (search.value || '').toLowerCase();
      const selected = category.value;
      return gamesData.filter((game) => {
        const matchCat = selected === 'All' || game.category === selected;
        const matchQuery = game.name.toLowerCase().includes(q) || game.shortDescription.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });
    }

    function render() {
      const results = filterGames();
      const maxPage = Math.max(Math.ceil(results.length / pageSize) - 1, 0);
      page = Math.min(page, maxPage);
      const slice = results.slice(page * pageSize, page * pageSize + pageSize);
      grid.innerHTML = slice.map(template).join('');
      prev.disabled = page === 0;
      next.disabled = page >= maxPage;
    }

    search.addEventListener('input', () => { page = 0; render(); });
    category.addEventListener('change', () => { page = 0; render(); });
    prev.addEventListener('click', () => { if (page > 0) { page--; render(); } });
    next.addEventListener('click', () => { page++; render(); });

    render();
  </script>

  <script type="application/ld+json" id="ld"></script>
  <script>
    const ldScript = document.getElementById('ld');
    function renderLd() {
      const list = gamesData.slice(0, 10).map((game, i) => ({
        '@type': 'ListItem',
        position: i + 1,
        url: `https://gameul.com/games/${game.slug}/`,
      }));
      ldScript.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'ItemList',
        name: 'GameUL Games',
        itemListElement: list,
      });
    }
    renderLd();
  </script>
</body>
</html>
