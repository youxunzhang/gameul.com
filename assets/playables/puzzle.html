  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameUL Puzzle Grid</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      font-family: 'Outfit', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(13, 120, 255, 0.18), #040910 58%);
      color: #f5f8ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.6rem;
    }

    main {
      width: min(460px, 100%);
      background: rgba(4, 8, 16, 0.8);
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2rem 2.2rem;
      box-shadow: 0 22px 40px rgba(6, 12, 26, 0.5);
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    p.meta {
      margin: 0;
      color: rgba(250, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .stats {
      display: flex;
      gap: 1rem;
      margin: 1.2rem 0 1.8rem;
      font-size: 0.88rem;
      color: rgba(240, 242, 255, 0.7);
    }

    .grid {
      display: grid;
      gap: 0.6rem;
    }

    .tile {
      width: 100%;
      padding-top: 100%;
      position: relative;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 30px rgba(6, 14, 30, 0.35);
    }

    .tile::after {
      content: '';
      position: absolute;
      inset: 14%;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.18);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .tile.active::after {
      opacity: 1;
    }

    .tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 30px rgba(8, 16, 40, 0.5);
    }

    button {
      margin-top: 2rem;
      padding: 0.7rem 1.6rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: rgba(108, 99, 255, 0.4);
      border-color: rgba(108, 99, 255, 0.6);
    }

    .toast {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #fff;
      min-height: 1.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Puzzle Grid</h1>
    <p class="meta">Rotate junctions to unify the energy flow.</p>
    <div class="stats">
      <span>Moves: <strong id="moves">0</strong></span>
      <span>Best: <strong id="best">--</strong></span>
      <span>Timer: <strong id="timer">00:00</strong></span>
    </div>
    <div class="grid" id="grid"></div>
    <button id="reset">Shuffle grid</button>
    <div class="toast" id="toast"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const label = params.get('label') || 'Puzzle Grid';
    const palette = (params.get('palette') || 'emerald').toLowerCase();
    const size = Math.min(6, Math.max(3, parseInt(params.get('size') || '4', 10)));

    const palettes = {
      emerald: ['#1dd1a1', '#10ac84', '#0d705c'],
      violet: ['#6c63ff', '#2b1e83', '#140c3f'],
      peach: ['#ff9f43', '#ff6b6b', '#c44536'],
      neon: ['#48dbfb', '#ff6bcb', '#341f97']
    };

    document.getElementById('title').textContent = label;

    const gridElement = document.getElementById('grid');
    gridElement.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    const movesElement = document.getElementById('moves');
    const bestElement = document.getElementById('best');
    const timerElement = document.getElementById('timer');
    const toastElement = document.getElementById('toast');
    const resetButton = document.getElementById('reset');

    const bestKey = `puzzle-best-${label}-${size}`;
    let storedBest = window.localStorage?.getItem(bestKey);
    if (storedBest) {
      bestElement.textContent = storedBest;
    }

    let moves = 0;
    let timer = 0;
    let interval = null;
    let grid = [];

    function paletteColor(index) {
      const colors = palettes[palette] || palettes.emerald;
      return colors[index % colors.length];
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60);
      return `${minutes.toString().padStart(2, '0')}:${remainder.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      if (interval) return;
      interval = setInterval(() => {
        timer += 1;
        timerElement.textContent = formatTime(timer);
      }, 1000);
    }

    function stopTimer() {
      if (interval) {
        clearInterval(interval);
        interval = null;
      }
    }

    function randomizeGrid() {
      grid = Array.from({ length: size * size }, () => (Math.random() > 0.5 ? 1 : 0));
      for (let i = 0; i < size; i += 1) {
        toggleCell(Math.floor(Math.random() * size), Math.floor(Math.random() * size), false);
      }
      updateTiles();
    }

    function index(x, y) {
      return y * size + x;
    }

    function toggleCell(x, y, countMove = true) {
      const positions = [
        [x, y],
        [x - 1, y],
        [x + 1, y],
        [x, y - 1],
        [x, y + 1]
      ];

      positions.forEach(([px, py]) => {
        if (px >= 0 && py >= 0 && px < size && py < size) {
          const idx = index(px, py);
          grid[idx] = grid[idx] ? 0 : 1;
        }
      });

      if (countMove) {
        moves += 1;
        movesElement.textContent = moves;
        if (moves === 1) {
          startTimer();
        }
      }

      updateTiles();
      checkSolved();
    }

    function updateTiles() {
      const tiles = gridElement.querySelectorAll('.tile');
      tiles.forEach((tile, idx) => {
        const state = grid[idx];
        tile.style.background = state ? paletteColor(0) : paletteColor(1);
        tile.classList.toggle('active', state === 1);
      });
    }

    function checkSolved() {
      const solved = grid.every((value) => value === 1);
      if (solved) {
        stopTimer();
        toastElement.textContent = `Stabilized in ${moves} moves · ${formatTime(timer)}.`;
        if (!storedBest || moves < parseInt(storedBest, 10)) {
          window.localStorage?.setItem(bestKey, moves);
          bestElement.textContent = moves;
          storedBest = String(moves);
        }
      } else {
        toastElement.textContent = '';
      }
    }

    function buildGrid() {
      gridElement.innerHTML = '';
      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const tile = document.createElement('button');
          tile.className = 'tile';
          tile.setAttribute('aria-label', `Tile ${x + 1}, ${y + 1}`);
          tile.addEventListener('click', () => toggleCell(x, y));
          gridElement.appendChild(tile);
        }
      }
    }

    resetButton.addEventListener('click', () => {
      moves = 0;
      timer = 0;
      movesElement.textContent = '0';
      timerElement.textContent = '00:00';
      toastElement.textContent = '';
      stopTimer();
      randomizeGrid();
    });

    buildGrid();
    randomizeGrid();
  </script>
</body>
</html>
