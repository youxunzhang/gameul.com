<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameUL – Free Games & AI/Gaming Tools</title>
<meta name="description" content="Play free online games and explore AI & gaming tools on GameUL.">
<link rel="preconnect" href="https://cdn.tailwindcss.com">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<header class="bg-gray-900 text-white p-4 flex justify-between items-center">
  <a href="/" class="text-xl font-bold">GameUL</a>
  <input id="search" placeholder="Search games or tools..." class="p-2 rounded text-black w-72">
</header>

<main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
  <aside class="lg:col-span-3">
    <nav class="bg-white p-4 rounded shadow">
      <h2 class="font-semibold mb-3">Navigation</h2>
      <ul class="space-y-2 text-sm">
        <li><a href="/src/pages/games.html" class="hover:text-blue-600">Games</a></li>
        <li><a href="/src/pages/tools.html" class="hover:text-blue-600">AI Tools</a></li>
        <li><a href="/src/pages/tools.html?category=Game%20Portals" class="hover:text-blue-600">Game Portals</a></li>
        <li><a href="/src/pages/rankings.html" class="hover:text-blue-600">Rankings</a></li>
        <li><a href="/src/pages/about.html" class="hover:text-blue-600">About</a></li>
      </ul>
    </nav>
    <div class="mt-4">
      <div class="ad-slot h-32 bg-gray-200 rounded flex items-center justify-center text-gray-500" data-slot="sidebar-top">Ad</div>
    </div>
  </aside>

  <section class="lg:col-span-9">
    <div class="ad-slot h-24 bg-gray-200 rounded mb-4 flex items-center justify-center text-gray-500" data-slot="banner-top">Ad</div>

    <h2 class="text-lg font-semibold mb-3">Featured Games</h2>
    <div id="game-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <h2 class="text-lg font-semibold mt-8 mb-3">Popular Tools</h2>
    <div id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>
</main>

<script>
(async function(){
  const [games, tools] = await Promise.all([
    fetch('/data/games.json').then(r=>r.json()),
    fetch('/data/links.json').then(r=>r.json())
  ]);

  // render games
  const g = document.getElementById('game-grid');
  games.slice(0,8).forEach(item=>{
    g.insertAdjacentHTML('beforeend', `
      <div class="bg-white shadow rounded p-2 hover:shadow-md transition">
        <a href="/src/pages/game.html?slug=${encodeURIComponent(item.slug)}">
          <img src="${item.cover}" alt="${item.title}" class="rounded w-full h-40 object-cover" loading="lazy">
          <h3 class="mt-2 font-semibold text-sm line-clamp-1">${item.title}</h3>
          <div class="text-xs text-gray-500">${item.categories.join(', ')}</div>
        </a>
      </div>
    `);
  });

  // render tools
  const t = document.getElementById('tool-grid');
  tools.slice(0,6).forEach(item=>{
    t.insertAdjacentHTML('beforeend', `
      <a href="${item.url}" target="_blank" rel="noopener nofollow" class="bg-white flex items-center gap-3 p-3 rounded shadow hover:shadow-md">
        <img src="${item.icon}" alt="${item.title}" class="w-8 h-8 rounded" loading="lazy">
        <div>
          <div class="font-medium">${item.title}</div>
          <div class="text-xs text-gray-500 line-clamp-1">${item.description}</div>
        </div>
      </a>
    `);
  });

  // simple search
  const input = document.getElementById('search');
  let timer=null;
  input.addEventListener('input', ()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>{
      const q = input.value.trim();
      if(q.length>1) location.href = '/src/pages/games.html?q=' + encodeURIComponent(q);
    },300);
  });
})();
</script>
</body>
</html>
