<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | GameUL</title>
  <meta name="description" content="Contact GameUL for partnerships, support, and content inquiries.">
  <meta property="og:site_name" content="GameUL">
  <meta property="og:title" content="Contact | GameUL">
  <meta property="og:description" content="Reach the GameUL team for support and partnerships.">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; line-height: 1.7; background: #0d102b; color: #f5f7ff; padding: 32px 18px; }
    main { max-width: 900px; margin: 0 auto; background: #13173a; padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); }
    h1, h2 { color: #fff; }
    a { color: #7b6ef6; }
    form { display: grid; gap: 12px; margin-top: 16px; }
    input, textarea { padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #fff; }
    button { padding: 12px; border-radius: 12px; border: none; background: linear-gradient(120deg, #7b6ef6, #4de0ff); color: #0d102b; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Contact GameUL</h1>
    <p>Have a partnership idea, content request, or support question? Send us a message and we will respond within 2 business days.</p>
    <h2>Email</h2>
    <p><a href="mailto:hello@gameul.com">hello@gameul.com</a></p>
    <h2>Contact Form</h2>
    <form>
      <label>
        Name
        <input type="text" name="name" placeholder="Your name" required>
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>
      <label>
        Message
        <textarea name="message" rows="5" placeholder="How can we help?" required></textarea>
      </label>
      <button type="submit" aria-disabled="true">Send (demo)</button>
    </form>
  </main>
</body>
</html>
